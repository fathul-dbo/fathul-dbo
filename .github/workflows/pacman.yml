name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man Animation
        env:
          INPUT_GITHUB_USER_NAME: ${{ github.repository_owner }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_GAMES: pacman
          INPUT_PLAYER_STYLE: opportunistic
          INPUT_HIDE_MONTH_LABELS: "false"
        run: |
          git clone --depth 1 https://github.com/abozanona/pacman-contribution-graph.git /tmp/pacman-action
          node /tmp/pacman-action/github-action/dist/index.js

      - name: Push SVG to Output Branch
        run: |
          cd dist
          git init
          git checkout -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update pacman contribution graph"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
